<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
<title>LMC — Passturbator</title>
<style>

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: Helvetica, Arial, sans-serif;
    background: #d0d0d0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* ── Control bar ── */
  .controls {
    width: 100%;
    background: #333;
    color: white;
    padding: 12px 24px;
    display: flex;
    gap: 16px;
    align-items: flex-end;
    flex-wrap: wrap;
  }
  .controls h1 {
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
    align-self: center;
    margin-right: 6px;
  }
  .type-tabs { display: flex; border-radius: 4px; overflow: hidden; align-self: center; }
  .type-tab {
    padding: 6px 14px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    border: none;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.6);
  }
  .type-tab.active { background: white; color: #333; }
  .ctrl-group { display: flex; flex-direction: column; gap: 3px; }
  .ctrl-group label {
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.6;
  }
  .ctrl-group input {
    font-family: Helvetica, Arial, sans-serif;
    font-size: 13px;
    padding: 5px 7px;
    border: none;
    border-radius: 3px;
    background: rgba(255,255,255,0.13);
    color: white;
    width: 140px;
    outline: none;
    border-bottom: 2px solid rgba(255,255,255,0.3);
  }
  .ctrl-group select option {
    background: #333;
    color: white;
  }
  .ctrl-group select:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .btn-print {
    margin-left: auto;
    align-self: center;
    padding: 8px 18px;
    background: white;
    color: #333;
    border: none;
    border-radius: 4px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-print:hover { background: #eee; }

  /* ── Preview ── */
  .preview-area {
    padding: 36px 20px 48px;
    display: flex;
    justify-content: center;
  }

  /*
    Zebra GX420T: 5.00" × 3.25" (landscape)
    Screen preview at 1.5× 96dpi = 720 × 468px
  */
  .pass-outer {
    width: 720px;
    height: 468px;
    background: white;
    position: relative;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.22);
  }

  .pass-body {
    position: absolute;
    inset: 0;
    display: flex;
  }

  /* ── Left content ── */
  .pass-left {
    flex: 1;
    /* top padding = 2.25" × (468px / 3.25in) ≈ 324px … that's the full card.
       2.25" from top of the physical label at 144px/in (1.5×96dpi) = 324px.
       But we want the title to START at 2.25" down = 324px top padding.
       That leaves very little room. Re-interpreting as 2.25cm ≈ 85px which is
       roughly 18mm — a natural "below the motto" gap. */
    padding: 0 32px 24px 32px;
    display: flex;
    flex-direction: column;
  }

  .pass-headline {
    font-size: 30px;
    font-weight: normal;
    color: #000;
    line-height: 1;
    /* 2.25" × 144px/in = 324px — but that would push it off the card.
       Treating as 2.25 cm × (468 / 8.255cm) ≈ 127px top margin */
    margin-top: 42px;
    margin-bottom: 0;
  }

  .pass-grid {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 14px;
    margin-top: 4px;
  }

  .pass-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px 28px;
    align-items: start;
  }

  /* Regular: only one row, collapse name slot to nothing */
  .pass-row.name-row .pass-cell { }

  .cell-label {
    font-size: 13px;
    color: #444;
    font-weight: normal;
    margin-bottom: 2px;
  }
  .cell-label.join-label { font-size: 16px; }
  .colour-highlight {
    font-size: 1.4em;
    font-weight: bold;
    color: #000;
  }
  /* The actual data values — label text normal, data value bold teal */
  .cell-value {
    font-size: 24px;
    font-weight: bold;
    color: #1a7a7a;
    line-height: 1.15;
  }
  .cell-value.name-value  { font-size: 28px; }
  .cell-value.time-value  { font-size: 37px; }
  .cell-value.seat-value  { font-size: 28px; }
  .cell-value.guests-value{ font-size: 24px; }

  /* Actual cruise time, shown bold within the headline */
  #headline-time { font-size: 25px; }

  .pass-cruise-name {
    font-size: 12px;
    color: #333;
    font-weight: bold;
    margin-top: 10px;
    padding-bottom: 6px;
  }



  /* ── Right logo panel ── */
  .pass-right {
    width: 180px;
    flex-shrink: 0;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    padding: 8px;
    gap: 6px;
    overflow: hidden;
  }
  .pass-right img {
    max-width: 100px;
    max-height: 60%;
    object-fit: contain;
    display: block;
    flex-shrink: 0;
  }
  .pass-boat-vertical {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-family: Helvetica, Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #000;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .logo-placeholder {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #bbb;
    font-size: 11px;
    text-align: center;
    cursor: pointer;
    border-left: 2px dashed #ddd;
  }
  .logo-placeholder svg { opacity: 0.35; }
  .logo-placeholder:hover { background: #fafafa; }

  /* Upload button in controls */
  .btn-logo {
    align-self: center;
    padding: 7px 14px;
    background: rgba(255,255,255,0.13);
    color: white;
    border: 1.5px dashed rgba(255,255,255,0.4);
    border-radius: 4px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-logo:hover { background: rgba(255,255,255,0.22); }
  #inp-logo { display: none; }

  /* ── Icons — hidden by default, shown in classic mode ── */
  .cell-icon {
    display: inline-block;
    width: 11px;
    height: 11px;
    vertical-align: middle;
    margin-right: 4px;
    margin-top: -2px;
    stroke: #1a7a7a;
    flex-shrink: 0;
  }
  .classic-mode .cell-icon {
    display: inline-block;
  }

  .classic-mode #headline-icon {
    opacity: 1 !important;
    stroke: #1a7a7a;
  }
  .classic-mode .pass-headline {
    font-size: 22px;
    font-weight: normal;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #000;
  }
  .classic-mode #headline-time {
    font-size: 33px;
    text-transform: none;
    letter-spacing: -0.01em;
  }
  .classic-mode .cell-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #888;
    font-weight: normal;
    margin-bottom: 4px;
  }
  .classic-mode .cell-label.join-label { font-size: 13px; }
  .classic-mode .cell-value {
    font-size: 28px;
    font-weight: bold;
    color: #000;
    letter-spacing: 0.02em;
  }
  .classic-mode .cell-value.time-value {
    font-size: 45px;
    font-weight: bold;
    color: #000;
    letter-spacing: -0.01em;
  }
  .classic-mode .cell-value.seat-value {
    font-size: 42px;
    font-weight: bold;
    color: #1a7a7a;
    letter-spacing: 0.04em;
  }
  .classic-mode .cell-value.guests-value {
    font-size: 42px;
    font-weight: bold;
    color: #000;
  }
  .classic-mode .pass-grid {
    gap: 2px;
    margin-top: 4px;
  }
  .classic-mode .pass-row {
    gap: 2px 16px;
    border-bottom: 1px solid #e8e8e8;
    padding-bottom: 6px;
    margin-bottom: 2px;
  }
  .classic-mode .pass-row:last-child {
    border-bottom: none;
  }
  .classic-mode #out-colour {
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #000;
    font-size: 1.2em;
  }
  .classic-mode .pass-cruise-name {
    font-size: 12px;
    font-weight: bold;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #aaa;
    margin-top: 0px;
  }

    @media print {
    @page { size: 5in 3.25in; margin: 0; }
    body { background: white; display: block; }
    .controls { display: none !important; }
    .preview-area { padding: 0; display: block; }
    .pass-outer {
      width: 5in;
      height: 3.25in;
      box-shadow: none;
    }
    /* Scale all sizes down by ÷1.5 for print */
    .pass-headline      { font-size: 20pt; margin-top: 0.44in; }
    #headline-time      { font-size: 17pt; }
    .cell-label         { font-size: 9pt; }
    .cell-value         { font-size: 16pt; }
    .cell-value.name-value   { font-size: 19pt; }
    .cell-value.time-value   { font-size: 25pt; }
    .cell-value.seat-value   { font-size: 19pt; }
    .cell-value.guests-value { font-size: 16pt; }
    .pass-cruise-name   { font-size: 11pt; }
    .classic-mode #headline-time         { font-size: 22pt; }
    .classic-mode .cell-value.time-value { font-size: 30pt; }
    .cell-label.join-label { font-size: 11pt; }
    .classic-mode .cell-label.join-label { font-size: 9pt; }
    .pass-right         { width: 1.25in; border-left: none; }
    .logo-placeholder   { display: none; }
  }


/* ── Layout shell ── */
html, body { margin: 0; padding: 0; height: 100%; box-sizing: border-box; }
.app { display: flex; width: 100%; height: 100vh; overflow: hidden; }
/* suppress leftover logo upload button from original ticket */
.btn-logo { display: none !important; }
#inp-logo { display: none !important; }

/* ── Guest panel (left) ── */
.guest-panel {
  width: 280px; flex-shrink: 0;
  background: #1e1e1e; color: white;
  display: flex; flex-direction: column; overflow: hidden;
  border-right: 1px solid #2a2a2a;
}
.sidebar-logo {
  flex-shrink: 0;
  padding: 16px 14px 12px;
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: white;
  border-bottom: 1px solid #2a2a2a;
}
.guest-header {
  padding: 16px 14px 12px; background: #1e1e1e;
  flex-shrink: 0; border-bottom: 1px solid #2a2a2a;
}
.drop-zone {
  border: 2px dashed #3a3a3a;
  border-radius: 6px;
  padding: 14px 10px;
  text-align: center;
  color: #555;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.15s;
  line-height: 1.6;
  position: relative;
}
.drop-zone:hover, .drop-zone.over { border-color: #1a7a7a; color: #1a9a9a; background: #1a2a2a; }
.drop-zone input[type=file] {
  position: absolute; inset: 0; width: 100%; height: 100%;
  opacity: 0; cursor: pointer;
}
.upload-status { font-size: 10px; color: #555; margin-top: 7px; min-height: 13px; }
.upload-status.ok { color: #7fc97f; }
.cruise-filter, .guest-search {
  width: 100%; font-family: Helvetica, Arial, sans-serif;
  font-size: 12px; padding: 7px 9px;
  background: #2a2a2a; color: white;
  border: 1px solid #333; border-radius: 6px; outline: none;
  margin-top: 10px;
  transition: border-color 0.15s;
}
.cruise-filter:focus, .guest-search:focus { border-color: #1a7a7a; }
.cruise-filter option { background: #2a2a2a; }
.guest-list-wrap { flex: 1; overflow-y: auto; padding: 6px 8px 16px; }
.made-by-footer {
  flex-shrink: 0;
  padding: 8px 14px;
  font-size: 10px;
  font-family: Helvetica, Arial, sans-serif;
  color: #666;
  text-align: center;
  border-top: 1px solid #2a2a2a;
}
.easter-egg-boat {
  position: fixed;
  right: 0;
  bottom: 0;
  width: 75vw;
  max-width: 1100px;
  z-index: -1;
  opacity: 0.9;
  pointer-events: none;
}
@media print {
  .easter-egg-boat { display: none !important; }
}
.guest-search::placeholder { color: #444; }
.guest-item {
  padding: 9px 10px; border-radius: 6px; cursor: pointer;
  border: 1px solid transparent; transition: background 0.12s, border-color 0.12s;
  position: relative; line-height: 1.5;
}
.guest-item + .guest-item { margin-top: 1px; }
.guest-item:hover { background: #242424; }
.guest-item.active { background: #163636; border-color: #1a7a7a; }
.guest-item.ticketed { opacity: 0.4; }
.guest-item.ticketed .guest-fullname { text-decoration: line-through; }
.guest-item.ticketed::after {
  content: '✓ printed';
  position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
  font-size: 9px; font-weight: bold; letter-spacing: 0.08em;
  text-transform: uppercase; color: #1a9a9a;
}
.guest-fullname { font-size: 12.5px; font-weight: 600; color: #e9e9e9; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.guest-sub { font-size: 11px; color: #fff; font-weight: 400; flex-shrink: 0; white-space: nowrap; }
.guest-item-row { display: flex; align-items: baseline; gap: 6px; overflow: hidden; }
.guest-item-row .guest-fullname { flex: 1 1 auto; min-width: 0; }
.printed-count {
  font-size: 10px; color: #1a7a7a; font-weight: bold;
  padding: 5px 0 2px; letter-spacing: 0.05em;
  display: none;
}
.printed-count.visible { display: block; }
.no-guests { font-size: 11px; color: #3a3a3a; text-align: center; padding: 40px 12px; line-height: 1.8; }

/* ── Ticket panel (right) ── */
.ticket-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; min-width: 0; }
.guest-banner {
  background: #1a4a4a; color: white; padding: 6px 16px;
  font-size: 11px; font-weight: bold; letter-spacing: 0.05em;
  display: none; align-items: center; gap: 8px; flex-shrink: 0;
  border-bottom: 1px solid #1a7a7a;
}
.guest-banner.on { display: flex; }
.guest-banner button {
  margin-left: auto; background: rgba(255,255,255,0.15); border: none;
  color: white; font-size: 10px; font-weight: bold; padding: 3px 9px;
  border-radius: 3px; cursor: pointer; font-family: Helvetica, Arial, sans-serif;
}
.ticket-scroll { flex: 1; overflow-y: auto; }

@media print {
  .guest-panel, .guest-banner { display: none !important; }
  .app { display: block; height: auto; overflow: visible; }
  .ticket-panel { display: block; }
  .ticket-scroll { overflow: visible; }
}
</style>
</head>

<div class="app">

  <!-- GUEST PANEL -->
  <div class="guest-panel">
    <div class="sidebar-logo">The Passturbator</div>
    <div class="guest-header">
      <div class="drop-zone" id="drop-zone">
        &#8679; Drop CSV file from SQL here or click to browse
        <input type="file" accept=".csv" onchange="loadCSV(event)">
      </div>
      <div class="upload-status" id="upload-status">No report loaded</div>
      <select class="cruise-filter" id="cruise-filter" onchange="onCruiseFilterChange()">
        <option value="">All cruises</option>
      </select>
    </div>
    <div class="guest-list-wrap">
      <input type="text" class="guest-search" id="guest-search" placeholder="Search…" oninput="renderList()">
      <div class="printed-count" id="printed-count"></div>
      <div id="guest-list"><div class="no-guests"><br></div></div>
    </div>
    <div class="made-by-footer">Proudly made by Ben Salsa 🍹</div>
  </div>

  <!-- TICKET PANEL -->
  <div class="ticket-panel">
    <div class="guest-banner" id="guest-banner">
      <span id="banner-text"></span>
      <button onclick="clearGuest()">✕ Clear</button>
    </div>
    <div class="ticket-scroll">
<!-- CONTROLS -->
<div class="controls">

  <div class="type-tabs">
    <button class="type-tab active" onclick="setType(&#39;premium&#39;)">Premium</button>
    <button class="type-tab" onclick="setType(&#39;classic&#39;)">Classic</button>
    <button class="type-tab" onclick="setType(&#39;junior&#39;)">Junior Explorer</button>
    <button class="type-tab" onclick="setType(&#39;beer&#39;)">Beer Voyage</button>
  </div>

  <div class="ctrl-group" id="ctrl-name" style="">
    <label>Guest Name</label>
    <input id="inp-name" type="text" value="Amit Doultani" oninput="sync()" placeholder="Full name">
  </div>

  <div class="ctrl-group">
    <label>Guests</label>
    <input id="inp-guests" type="number" value="2" min="1" max="99" oninput="sync()" style="width:64px">
  </div>

  <div class="ctrl-group">
    <label>Seat</label>
    <input id="inp-seat" type="text" value="P5" oninput="sync()" style="width:72px">
  </div>

  <div class="ctrl-group">
    <label>Time</label>
    <select id="inp-time" onchange="syncTime()" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;padding:5px 7px;border:none;border-radius:3px;background:rgba(255,255,255,0.13);color:white;outline:none;border-bottom:2px solid rgba(255,255,255,0.3);width:110px;"><option>10:00 AM</option><option>12:00 PM</option><option>6:00 PM</option></select>
  </div>

  <div class="ctrl-group">
    <label>Line Colour</label>
    <select id="inp-colour" onchange="syncColour()" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;padding:5px 7px;border:none;border-radius:3px;background:rgba(255,255,255,0.13);color:white;outline:none;border-bottom:2px solid rgba(255,255,255,0.3);width:110px;">
      <option value="yellow">Yellow</option>
      <option value="blue">Blue</option>
      <option value="green">Green</option>
    </select>
  </div>

  <div class="ctrl-group">
    <select id="inp-cruise" onchange="syncCruise()" style="font-family:Helvetica,Arial,sans-serif;font-size:13px;padding:5px 7px;border:none;border-radius:3px;background:rgba(255,255,255,0.13);color:white;outline:none;border-bottom:2px solid rgba(255,255,255,0.3);width:190px;">
      <option>Daughter Of The Peaks II</option>
      <option>Minnewanka II</option>
      <option>Alberta Explorer</option>
      <option>Sandra Lynn</option>
    </select>
  </div>

  <button class="btn-print" onclick="markPrinted()">🖨 Print</button>
</div>

var allGuests = [];

function loadCSV(e) {
  var file = e.target.files[0];
  if (!file) return;
  document.getElementById('upload-status').textContent = 'Reading ' + file.name + '...';
  var reader = new FileReader();
  reader.onload = function(ev) {
    parseCSV(ev.target.result, file.name);
  };
  reader.onerror = function() {
    document.getElementById('upload-status').textContent = 'Error reading file';
  };
  reader.readAsText(file, 'UTF-8');
}

function parseCSV(text, filename) {
  // Strip BOM
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);

  var lines = text.split('\n');
  // Also handle \r\n
  lines = lines.map(function(l) { return l.replace(/\r$/, ''); });

  // Find header row
  var headerIdx = -1, headers = [];
  for (var i = 0; i < lines.length; i++) {
    if (lines[i].indexOf('CustomerName') !== -1) {
      headers = splitLine(lines[i]);
      headerIdx = i;
      break;
    }
  }

  if (headerIdx === -1) {
    document.getElementById('upload-status').textContent = 'Could not find header row';
    return;
  }

  var iName     = headers.indexOf('CustomerName');
  var iTime     = headers.indexOf('textbox18');
  var iSchedule = headers.indexOf('Schedule_Name');
  var iPax      = headers.indexOf('PAX');

  var iOrder = -1;
  for (var h = 0; h < headers.length; h++) {
    var hLower = (headers[h] || '').toLowerCase().replace(/[\s_]+/g, '');
    if (hLower.indexOf('order') !== -1 || hLower.indexOf('booking') !== -1) { iOrder = h; break; }
  }

  var seen = {}, guests = [];

  for (var j = headerIdx + 1; j < lines.length; j++) {
    if (!lines[j].trim()) continue;
    var row = splitLine(lines[j]);
    if (row.length < 5) continue;

    var name     = (row[iName]     || '').trim();
    var rawTime  = (row[iTime]     || '').trim();
    var schedule = (row[iSchedule] || '').trim();
    var pax      = parseInt(row[iPax]) || 1;
    var orderId  = iOrder !== -1 ? (row[iOrder] || '').trim() : '';

    if (!name || !schedule) continue;
    if (schedule.toLowerCase().indexOf('fishing') !== -1) continue;
    if (schedule.toLowerCase().indexOf('charter') !== -1) continue;

    var time  = fmtTime(rawTime);
    var label = time + ' \u2014 ' + schedule.split('>').pop().trim();
    var key   = name + '|' + label;

    if (seen[key]) {
      seen[key].pax += pax;
    } else {
      var g = { name: name, orderId: orderId, pax: pax, time: time, label: label, type: guessType(schedule) };
      seen[key] = g;
      guests.push(g);
    }
  }

  allGuests = guests;

  // Build cruise filter
  var labelSet = {};
  guests.forEach(function(g) { labelSet[g.label] = 1; });
  var cruiseLabels = Object.keys(labelSet).sort();

  var filter = document.getElementById('cruise-filter');
  filter.innerHTML = '<option value="">All (' + guests.length + ' guests)</option>';
  cruiseLabels.forEach(function(l) {
    var o = document.createElement('option');
    o.value = l; o.textContent = l;
    filter.appendChild(o);
  });

  document.getElementById('upload-status').textContent = '\u2713 ' + guests.length + ' guests \u2014 ' + filename;
  document.getElementById('upload-status').className = 'upload-status ok';
  renderList();
}

function fmtTime(raw) {
  var m = raw.match(/(\d+):(\d+):\d+\s*(AM|PM)/i);
  if (!m) return raw.trim();
  return m[1] + ':' + m[2] + ' ' + m[3].toUpperCase();
}

function guessType(s) {
  s = s.toLowerCase();
  if (s.indexOf('premium') !== -1) return 'premium';
  if (s.indexOf('beer') !== -1) return 'beer';
  if (s.indexOf('family') !== -1 || s.indexOf('junior') !== -1) return 'junior';
  return 'classic';
}

function splitLine(line) {
  var result = [], cur = '', inQ = false;
  for (var i = 0; i < line.length; i++) {
    var c = line[i];
    if (c === '"') {
      if (inQ && line[i+1] === '"') { cur += '"'; i++; }
      else { inQ = !inQ; }
    } else if (c === ',' && !inQ) {
      result.push(cur.trim()); cur = '';
    } else {
      cur += c;
    }
  }
  result.push(cur.trim());
  return result;
}

function renderList() {
  var cruise = document.getElementById('cruise-filter').value;
  var search = document.getElementById('guest-search').value.toLowerCase().trim();

  var filtered = allGuests.filter(function(g) {
    return (!cruise || g.label === cruise) &&
           (!search || g.name.toLowerCase().indexOf(search) !== -1);
  });

  filtered.sort(function(a, b) {
    return a.time !== b.time ? a.time.localeCompare(b.time) : a.name.localeCompare(b.name);
  });

  var list = document.getElementById('guest-list');
  if (!filtered.length) {
    list.innerHTML = '<div class="no-guests">No guests match</div>';
    return;
  }

  list.innerHTML = filtered.map(function(g) {
    var idx = allGuests.indexOf(g);
    var ticketed = printedGuests.has(idx) ? ' ticketed' : '';
    return '<div class="guest-item' + ticketed + '" id="gi' + idx + '" onclick="pickGuest(' + idx + ')">' +
      '<div class="guest-item-row">' +
        '<span class="guest-fullname">' + g.name + '</span>' +
        '<span class="guest-sub">' + g.pax + ' pax' + (g.orderId ? ' \u2014 ' + g.orderId : '') + '</span>' +
      '</div>' +
      '</div>';
  }).join('');
}

function onCruiseFilterChange() {
  var label = document.getElementById('cruise-filter').value;
  if (label) {
    var match = allGuests.filter(function(g) { return g.label === label; })[0];
    if (match) {
      setType(match.type);
      selectOrAddTime(match.time);
      syncTime();
      sync();
    }
  }
  renderList();
}

var activeIdx = null;
var printedGuests = new Set();

function markPrinted() {
  if (activeIdx !== null) {
    printedGuests.add(activeIdx);
    var el = document.getElementById('gi' + activeIdx);
    if (el) el.classList.add('ticketed');
    updatePrintedCount();
  }
  window.print();
}

function updatePrintedCount() {
  var el = document.getElementById('printed-count');
  if (!el) return;
  var n = printedGuests.size;
  if (n > 0) {
    el.textContent = n + ' ticket' + (n > 1 ? 's' : '') + ' printed this session';
    el.classList.add('visible');
  } else {
    el.classList.remove('visible');
  }
}

function timeToMinutes(timeStr) {
  var m = String(timeStr).match(/(\d+):(\d+)\s*(AM|PM)/i);
  if (!m) return null;
  var h = parseInt(m[1], 10) % 12;
  var mins = parseInt(m[2], 10);
  if (/pm/i.test(m[3])) h += 12;
  return h * 60 + mins;
}

function selectOrAddTime(timeText) {
  var sel = document.getElementById('inp-time');
  for (var i = 0; i < sel.options.length; i++) {
    if (sel.options[i].text === timeText) { sel.selectedIndex = i; return; }
  }
  if (cruiseType === 'classic') {
    // No exact slot for this time — snap to the closest scheduled departure
    // so the colour/cruise it's actually tied to comes along with it,
    // instead of showing a made-up, unassigned time.
    var target = timeToMinutes(timeText);
    var best = 0, bestDiff = Infinity;
    for (var j = 0; j < sel.options.length; j++) {
      var optMinutes = timeToMinutes(sel.options[j].value);
      var diff = (target !== null && optMinutes !== null) ? Math.abs(optMinutes - target) : Infinity;
      if (diff < bestDiff) { bestDiff = diff; best = j; }
    }
    sel.selectedIndex = best;
    return;
  }
  // Not a classic preset — for other tabs it's fine to show the literal CSV time.
  var opt = document.createElement('option');
  opt.text = timeText;
  opt.value = timeText;
  sel.add(opt);
  sel.selectedIndex = sel.options.length - 1;
}

function pickGuest(idx) {
  activeIdx = idx;
  var g = allGuests[idx];
  document.querySelectorAll('.guest-item').forEach(function(el) { el.classList.remove('active'); });
  var el = document.getElementById('gi' + idx);
  if (el) el.classList.add('active');

  document.getElementById('inp-name').value = g.name;
  document.getElementById('inp-guests').value = g.pax;
  setType(g.type);

  selectOrAddTime(g.time);
  syncTime();
  sync();

  document.getElementById('banner-text').textContent =
    g.name + '  \u00b7  ' + g.time + '  \u00b7  ' + g.pax + ' guests \u2014 review then print';
  document.getElementById('guest-banner').classList.add('on');
}

function clearGuest() {
  activeIdx = null;
  document.getElementById('inp-name').value = '';
  document.getElementById('guest-banner').classList.remove('on');
  document.querySelectorAll('.guest-item').forEach(function(el) { el.classList.remove('active'); });
  sync();
}

// Drop zone drag highlight
var dz = document.getElementById('drop-zone');
if (dz) {
  dz.addEventListener('dragover', function(e) { e.preventDefault(); dz.classList.add('over'); });
  dz.addEventListener('dragleave', function() { dz.classList.remove('over'); });
  dz.addEventListener('drop', function(e) {
    e.preventDefault(); dz.classList.remove('over');
    var file = e.dataTransfer.files[0];
    if (file) { var r = new FileReader(); r.onload = function(ev) { parseCSV(ev.target.result, file.name); }; r.readAsText(file); }
  });
}

// ── Original ticket script ──────────────────────────────────

  var ALL_TIMES = [
    '9:00 AM','9:30 AM','10:00 AM','10:30 AM','11:00 AM','11:30 AM',
    '12:00 PM','12:30 PM','1:00 PM','1:30 PM','2:00 PM','2:30 PM',
    '3:00 PM','3:30 PM','4:00 PM','4:30 PM','5:00 PM','5:30 PM',
    '6:00 PM','6:30 PM','7:00 PM'
  ];
  var TYPE_TIMES = {
    premium: ['10:00 AM', '12:00 PM', '6:00 PM'],
    classic: [
      {time:'10:00 AM', cruise:'DPII PREMIUM', colour:'yellow'},
      {time:'10:10 AM', cruise:'SL', colour:'blue'},
      {time:'10:30 AM', cruise:'MII', colour:'green'},
      {time:'11:00 AM', cruise:'AE / RMV', colour:'green'},
      {time:'11:30 AM', cruise:'SL', colour:'blue'},
      {time:'12:00 PM', cruise:'DPII PREMIUM', colour:'yellow'},
      {time:'12:30 PM', cruise:'MII', colour:'green'},
      {time:'1:00 PM', cruise:'AE', colour:'blue'},
      {time:'1:30 PM', cruise:'SL', colour:'blue'},
      {time:'2:00 PM', cruise:'DPII', colour:'blue'},
      {time:'2:30 PM', cruise:'MII', colour:'green'},
      {time:'3:00 PM', cruise:'AE', colour:'blue'},
      {time:'3:30 PM', cruise:'SL', colour:'yellow'},
      {time:'4:00 PM', cruise:'DPII', colour:'blue'},
      {time:'4:30 PM', cruise:'MII', colour:'green'},
      {time:'5:00 PM', cruise:'AE — CLASSIC', colour:'green'},
      {time:'5:00 PM', cruise:'SL — BEER', colour:'yellow'},
      {time:'6:00 PM', cruise:'DPII PREMIUM', colour:'yellow'},
      {time:'6:00 PM', cruise:'MII', colour:'blue'},
      {time:'5:00 PM', cruise:'MII — BEER', colour:'yellow'},
      {time:'5:00 PM', cruise:'AE — CLASSIC', colour:'blue'}
    ],
    junior:  ALL_TIMES,
    beer:    ['5:00 PM']  /* locked — Beer Voyage only runs at 5pm */
  };

  // Per-tab saved state
  var tabState = {
    premium: { time: '10:00 AM', colour: 'yellow', cruise: 'Daughter Of The Peaks II' },
    classic: { time: null, colour: null, cruise: null },
    junior:  { time: null, colour: null, cruise: null },
    beer:    { time: '5:00 PM',  colour: 'yellow', cruise: 'Minnewanka II' }
  };

  function saveTabState(t) {
    if (t === 'classic') return; // classic drives itself from time dropdown
    var sel = document.getElementById('inp-time');
    tabState[t] = {
      time:   sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text || sel.value : '',
      colour: document.getElementById('inp-colour').value,
      cruise: document.getElementById('inp-cruise').value
    };
  }

  function restoreTabState(t) {
    var state = tabState[t];
    if (!state) return;

    // Colour — lock to yellow for premium + beer, skip for classic (time dropdown drives it)
    var colourSel = document.getElementById('inp-colour');
    if (t === 'premium' || t === 'beer') {
      colourSel.innerHTML = '<option value="yellow">Yellow</option>';
      colourSel.value = 'yellow';
      syncColour();
    } else if (t !== 'classic') {
      // junior — restore full options
      colourSel.innerHTML = '<option value="yellow">Yellow</option><option value="blue">Blue</option><option value="green">Green</option>';
      if (state.colour) colourSel.value = state.colour;
      syncColour();
    } else {
      // classic — just make sure all options are there, syncClassicSelection will set the value
      colourSel.innerHTML = '<option value="yellow">Yellow</option><option value="blue">Blue</option><option value="green">Green</option>';
    }

    // Cruise — auto DPII for premium
    var cruiseSel = document.getElementById('inp-cruise');
    var targetCruise = (t === 'premium') ? 'Daughter Of The Peaks II' :
                       (t === 'beer')    ? 'Minnewanka II' :
                       (state.cruise || null);
    if (targetCruise) {
      for (var k = 0; k < cruiseSel.options.length; k++) {
        if (cruiseSel.options[k].value === targetCruise || cruiseSel.options[k].text === targetCruise) {
          cruiseSel.selectedIndex = k; break;
        }
      }
    }
    syncCruise();

    // Time — restore saved or default
    if (state.time) {
      var timeSel = document.getElementById('inp-time');
      for (var j = 0; j < timeSel.options.length; j++) {
        if (timeSel.options[j].text === state.time || timeSel.options[j].value === state.time) {
          timeSel.selectedIndex = j; break;
        }
      }
    }
  }

  function rebuildTimes(t) {
    var sel = document.getElementById('inp-time');
    var times = TYPE_TIMES[t] || ALL_TIMES;

    if (t === 'classic') {
      // Always ensure full colour options available — syncClassicSelection will set the value
      var colEl = document.getElementById('inp-colour');
      colEl.innerHTML = '<option value="yellow">Yellow</option><option value="blue">Blue</option><option value="green">Green</option>';
      sel.innerHTML = times.map(function(v) {
        return '<option value="' + v.time + '" data-cruise="' + v.cruise.replace(/"/g, '&quot;') +
          '" data-colour="' + v.colour + '">' + v.time + ' — ' + v.cruise + ' — ' +
          v.colour.charAt(0).toUpperCase() + v.colour.slice(1) + '</option>';
      }).join('');
      syncClassicSelection();
    } else {
      sel.innerHTML = times.map(function(v) {
        return '<option>' + v + '</option>';
      }).join('');
      restoreTabState(t);
      syncTime();
    }
  }

  var CRUISE_FULL_NAMES = {
    'DPII': 'Daughter Of The Peaks II',
    'MII':  'Minnewanka II',
    'AE':   'Alberta Explorer',
    'SL':   'Sandra Lynn'
  };

  function classicCruiseFullName(code) {
    if (!code) return code;
    var base = code.split(' ')[0]; // 'DPII PREMIUM' -> 'DPII', 'SL — BEER' -> 'SL', etc.
    return CRUISE_FULL_NAMES[base] || code;
  }

  function syncClassicSelection() {
    var sel = document.getElementById('inp-time');
    var opt = sel.options[sel.selectedIndex];
    if (!opt) return;

    document.getElementById('out-time').textContent = subtractMins(opt.value, 15);

    // Drive the actual Line Colour / Cruise controls from the picked time,
    // then let their own sync functions update the display — instead of
    // writing an independent value straight into the output.
    var colourSel = document.getElementById('inp-colour');
    var cruiseSel = document.getElementById('inp-cruise');
    if (opt.dataset.colour) colourSel.value = opt.dataset.colour;
    if (opt.dataset.cruise) {
      var fullName = classicCruiseFullName(opt.dataset.cruise);
      if ([].some.call(cruiseSel.options, function(o) { return o.value === fullName; })) {
        cruiseSel.value = fullName;
      }
    }
    syncColour();
    syncCruise();
    updateHeadline();
  }

  function subtractMins(timeStr, mins) {
    var parts = timeStr.match(/(\d+):(\d+)\s*(AM|PM)/i);
    if (!parts) return timeStr;
    var h = parseInt(parts[1]), m = parseInt(parts[2]), period = parts[3].toUpperCase();
    if (period === 'PM' && h !== 12) h += 12;
    if (period === 'AM' && h === 12) h = 0;
    var total = h * 60 + m - mins;
    if (total < 0) total += 1440;
    var nh = Math.floor(total / 60) % 24, nm = total % 60;
    var np = nh < 12 ? 'AM' : 'PM';
    var dh = nh % 12 || 12;
    return dh + ':' + (nm < 10 ? '0' + nm : nm) + ' ' + np;
  }

  function syncTime() {
    if (cruiseType === 'classic') {
      syncClassicSelection();
      return;
    }
    var val = document.getElementById('inp-time').value;
    document.getElementById('out-time').textContent = subtractMins(val, 15);
    updateHeadline();
  }

  function syncColour() {
    var val = document.getElementById('inp-colour').value;
    document.getElementById('out-colour').textContent = val;
  }

  function syncCruise() {
    var val = document.getElementById('inp-cruise').value;
    document.getElementById('out-cruise').textContent = val;
  }

  document.getElementById('out-headline').dataset.title = 'Premium Cruise Boarding Pass';
  rebuildTimes('premium');
  syncCruise();
  syncColour();

  var cruiseType = 'premium';

  function setType(t) {
    saveTabState(cruiseType);
    cruiseType = t;
    document.querySelectorAll('.type-tab').forEach(function(btn, i) {
      btn.classList.toggle('active',
        (i===0 && t==='premium') ||
        (i===1 && t==='classic') ||
        (i===2 && t==='junior') ||
        (i===3 && t==='beer')
      );
    });

    var nameCtrl = document.getElementById('ctrl-name');
    var rowName  = document.getElementById('row-name');
    var noName   = (t === 'classic' || t === 'junior');

    var titles = {
      premium: 'Premium Cruise Boarding Pass',
      classic: 'Classic Cruise Boarding Pass',
      junior:  'Junior Explorer Boarding Pass',
      beer:    'Beer Voyage Boarding Pass'
    };

    if (noName) {
      nameCtrl.style.display = 'none';
      rowName.style.gridTemplateColumns = '0 1fr';
      document.getElementById('cell-name').style.overflow = 'hidden';
      document.getElementById('cell-name').style.padding  = '0';
    } else {
      nameCtrl.style.display = '';
      rowName.style.gridTemplateColumns = '';
      document.getElementById('cell-name').style.overflow = '';
      document.getElementById('cell-name').style.padding  = '';
    }
    document.getElementById('out-headline').dataset.title = titles[t];

    var passBody = document.querySelector('.pass-body');
    passBody.classList.remove('classic-mode');
    if (t === 'classic' || t === 'junior') {
      passBody.classList.add('classic-mode');
    }
    rebuildTimes(t);
    sync();
  }

  function updateHeadline() {
    var el   = document.getElementById('out-headline');
    var base = el.dataset.title || 'Premium Cruise Boarding Pass';
    var time = document.getElementById('inp-time').value || '';
    // Remove old time-span and text nodes, keep SVG icon
    Array.from(el.childNodes).forEach(function(n) {
      if (n.nodeType === 3 || (n.nodeType === 1 && n.id === 'headline-time')) el.removeChild(n);
    });
    // Bold time span
    var timeSpan = document.createElement('span');
    timeSpan.id = 'headline-time';
    timeSpan.style.fontWeight = 'bold';
    timeSpan.textContent = time;
    el.appendChild(timeSpan);
    // Normal weight title
    el.appendChild(document.createTextNode(' ' + base));
  }

  function sync() {
    document.getElementById('out-name').textContent   = document.getElementById('inp-name').value   || '\u00a0';
    document.getElementById('out-guests').textContent = document.getElementById('inp-guests').value || '\u00a0';
    document.getElementById('out-seat').textContent   = document.getElementById('inp-seat').value   || '\u00a0';
    syncTime();
    syncCruise();
  }
